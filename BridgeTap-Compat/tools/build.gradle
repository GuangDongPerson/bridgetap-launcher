dependencies {
	implementation project(":core")
	implementation project(":hud")
	implementation "org.ow2.asm:asm:9.7.1"
	implementation "com.google.code.gson:gson:2.11.0"
}

jar {
	archiveBaseName = "bridgetap-tools"
	manifest {
		attributes("Main-Class": "com.bridger.compat.tools.ScanMain")
	}
	duplicatesStrategy = DuplicatesStrategy.EXCLUDE
	from {
		configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
	} {
		exclude "META-INF/*.SF", "META-INF/*.DSA", "META-INF/*.RSA", "module-info.class"
	}
}

tasks.register("preview", JavaExec) {
	dependsOn jar
	group = "verification"
	description = "Renders the HUD to build/preview/bridgetap-hud.png without a GPU."
	classpath = files(tasks.jar.archiveFile)
	mainClass = "com.bridger.compat.tools.PreviewMain"
	args layout.buildDirectory.file("preview/bridgetap-hud.png").get().asFile.absolutePath
	doFirst { layout.buildDirectory.dir("preview").get().asFile.mkdirs() }
	jvmArgs "-Djava.awt.headless=true"
}
