# BridgeTap — 模组语言包（默认：英文）
#
# 怎么用：
#   1. 这个文件是内置的兜底语言。想改文案，**不要改 jar**：把它复制到
#      <游戏目录>/config/lang/<code>.properties（例如 config/lang/zh_CN.properties），
#      改那边的值即可，注入器的「游戏内语言」里选它。
#   2. 加一门语言：复制本文件 → 改名 → 翻译值 → 在注入器里选。
#      键名一个都不要改，缺的键会回退到英文。
#   3. {0} {1} … 是占位符，顺序固定，可以调整位置但不要删。
#      颜色码（§a 之类）不在这里，由代码按「文本颜色」设置自己加。
#
# 前缀 hud. = 游戏内面板；entry. = 每一条跳的记录；chat. = /bt 的回复

hud.status.bridging=Bridging
hud.status.success=Success
hud.status.failed=Failed
# {0}=状态词（已带上颜色码） {1}=用时（保留两位小数） {2}=跳数 {3}=轴
hud.header={0} {1}s {2} jumps, axis: {3}
# 显示模式 = TIME 时的首行
hud.time=Time: {0}s
# 空闲时的坐标行：{0}=品牌名 {1}{2}{3}=X Y Z
# 这一行的分隔符与标签颜色是品牌样式的一部分（原版 §8| §7X §f…），随文案一起搬进语言包；
# 翻译时只改标签字母，§ 颜色码原样保留。
hud.idle={0} §8| §7X §f{1}  §7Y §f{2}  §7Z §f{3}
# 还没进世界
hud.waiting={0} §8| §7waiting for world

entry.flat=Flat
entry.late=Late
entry.jump=Jump
entry.tapSpeed=Tap Speed
entry.holdSpeed=Hold Speed
entry.fourBlock=4b
entry.fiveBlock=5b
entry.sixBlock=6b
entry.turn=Turn
entry.failTap=Fail Tap
entry.headHitter=Head hitter
entry.plates=Plates
entry.platesMinus1=Plates-1t
# 首平没有上一列可比时的增量占位
entry.noDelta=+.n/a

chat.prefix=[BridgeTap]
chat.hud=HUD: {0}
chat.enabled=Enabled
chat.disabled=Disabled
chat.reset=Stats reset!
chat.axisSet=Axis set to: {0}
chat.chatOn=Chat output: on
chat.chatOff=Chat output: off
# 帮助首行：标题（黄）+ 用法提示（灰），两段分开是为了保住原版的两种颜色
chat.help.header=Available commands:
chat.help.toggle=/bt toggle - Enable/disable the HUD
chat.help.reset=/bt reset - Reset the stats
chat.help.axis=/bt axis <AUTO|Z|X> - Set the tracking axis
chat.help.chat=/bt chat - Toggle chat output (on / off)
chat.usage.axis=Usage: /bt axis <AUTO|Z|X>
chat.usage.chat=Usage: /bt chat [on|off]
# 跑完一局的聊天结算行（前缀由代码按 chat.prefix 拼，绿色）
# {0}=用时 {1}=Plates-1t 小数 {2}=Plates 小数
chat.success=Success! Time: §e{0}s §a| Plates-1t: §e{1} §a| Plates: §e{2}
